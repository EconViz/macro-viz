[project]
name = "macro-viz"
version = "0.2.0.dev0"
description = "Textbook macroeconomic analysis and diagrams for EconViz."
readme = "README.md"
authors = [{ name = "EconViz" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
keywords = ["economics", "macroeconomics", "visualization", "education"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "mosaickit>=1.0.0rc9,<2",
]

[project.urls]
Homepage = "https://github.com/EconViz/macro-viz"
Repository = "https://github.com/EconViz/macro-viz"
Issues = "https://github.com/EconViz/macro-viz/issues"
Changelog = "https://github.com/EconViz/macro-viz/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "macro_viz"
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
